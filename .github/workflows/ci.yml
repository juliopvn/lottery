name: CI

# El código fuente vive en GitLab y llega a GitHub por push mirroring, así
# que el disparador útil es `push` (los PR/MR viven en GitLab). No se activan
# reglas de protección de rama con checks obligatorios: bloquearían el mirror.
on:
  push:
  workflow_dispatch:

env:
  APP_URL: http://localhost:3000
  NODE_ENV: test
  MONGODB_URI: mongodb://localhost:27017
  MONGODB_DB: lottery_ci
  JWT_SECRET: ci-secret-please-change-me-32-characters-minimum
  MAGIC_LINK_TTL_MINUTES: "15"
  ADMIN_EMAIL: admin@example.com
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: whsec_ci_fixed_test_secret_the_webhook_is_simulated
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
  STRIPE_CURRENCY: mxn
  EMAIL_PROVIDER: mailhog
  EMAIL_FROM: "Lottery <no-reply@mail.jpavon-tech.com>"
  MAILHOG_HOST: localhost
  MAILHOG_PORT: "1025"
  E2E: "0"
  E2E_REAL_STRIPE: "0"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:indexes
      - run: npm run test -- --coverage

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports: ["1025:1025", "8025:8025"]

    env:
      CI: "true"
      E2E: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm run db:indexes
      - run: npm run build

      # El seed determinista lo dispara el globalSetup de Playwright
      # (playwright.config.ts); aquí solo se corre la suite.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
